# Vhost Apache de l'HÔTE (VPS de boutique-old) pour la nouvelle préprod : reverse proxy vers le conteneur
# (docker-compose.preprod.yml, 127.0.0.1:8095). Remplace l'ancienne préprod de boutique-old
# (preprod-app.conf + preprod-app-le-ssl.conf, désactivés mais conservés pour un retour arrière).
# Procédure : DEPLOIEMENT_VPS.md §8. Modules requis : ssl rewrite proxy proxy_http headers.
# Certificat : celui déjà délivré pour preprod.app.coprotec.net (renouvelé par le timer certbot).
#
# Accès restreint : IP des bureaux, OU identifiant (auth basique, TEMPORAIRE le temps des tests), SAUF l'URL
# de notification Monetico, que les serveurs Monetico doivent pouvoir appeler.

<VirtualHost *:80>
    ServerName preprod.app.coprotec.net
    # Let's Encrypt (renouvellement en http-01) avant la redirection HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName preprod.app.coprotec.net

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/preprod.app.coprotec.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/preprod.app.coprotec.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog  ${APACHE_LOG_DIR}/preprod.app.coprotec.net.error.log
    CustomLog ${APACHE_LOG_DIR}/preprod.app.coprotec.net.access.log combined

    # Reverse proxy vers le conteneur (Symfony fait confiance aux X-Forwarded-* : TRUSTED_PROXIES).
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        / http://127.0.0.1:8095/
    ProxyPassReverse / http://127.0.0.1:8095/

    <Location />
        # TEMPORAIRE (tests) : accès par identifiant en plus des IP des bureaux.
        # Pour le retirer : supprimer les 3 lignes Auth* et la ligne « Require valid-user », puis configtest + reload.
        AuthType Basic
        AuthName "Preprod boutique"
        AuthUserFile /etc/apache2/.htpasswd-boutique
        <RequireAny>
            # IP des bureaux COPROTEC
            Require ip 89.87.179.97 89.87.179.99
            Require valid-user
        </RequireAny>
    </Location>

    # Notification serveur à serveur de Monetico : jamais derrière l'authentification.
    <Location /paiement/monetico/notification>
        Require all granted
    </Location>
</VirtualHost>
</IfModule>
