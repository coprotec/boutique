<VirtualHost *:80>
    DocumentRoot /var/www/app.coprotec.net/httpdocs/public

    <Directory /var/www/app.coprotec.net/httpdocs/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Derrière l'Apache de l'hôte : l'IP client et le schéma arrivent dans X-Forwarded-*
    # (TRUSTED_PROXIES côté Symfony).

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
