<VirtualHost *:80>
    DocumentRoot /var/www/boutique/public

    <Directory /var/www/boutique/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Derrière le Nginx de l'hôte : l'IP client et le schéma arrivent dans X-Forwarded-*
    # (TRUSTED_PROXIES côté Symfony).

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
