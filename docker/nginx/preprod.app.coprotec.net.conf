# Vhost Nginx de l'HÔTE (VPS coplanif) pour la préprod. À copier dans /etc/nginx/sites-available/ puis activer.
# Certificat : certbot --nginx -d preprod.app.coprotec.net
# Accès restreint (auth basique + IP) comme la préprod coplanif, SAUF l'URL de notification Monetico,
# que les serveurs Monetico doivent pouvoir appeler.

server {
    listen 80;
    server_name preprod.app.coprotec.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name preprod.app.coprotec.net;

    ssl_certificate     /etc/letsencrypt/live/preprod.app.coprotec.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preprod.app.coprotec.net/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 8m;

    location / {
        # IP des bureaux (reprises de la préprod coplanif, à vérifier) ou identifiant.
        satisfy any;
        allow 89.87.179.97;
        allow 89.87.179.99;
        allow 152.228.175.100;
        deny all;
        auth_basic "Préprod boutique";
        auth_basic_user_file /etc/nginx/.htpasswd;

        include /etc/nginx/snippets/boutique_proxy.conf;
    }

    # Notification serveur à serveur de Monetico : jamais derrière l'authentification.
    location = /paiement/monetico/notification {
        include /etc/nginx/snippets/boutique_proxy.conf;
    }
}

