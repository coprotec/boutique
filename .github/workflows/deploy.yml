# Une branche par environnement :
#   main     → tests uniquement (développement)
#   preprod  → tests puis déploiement de la préprod (/srv/preprod.app.coprotec.net)
#   prod     → tests puis déploiement de la prod (/srv/app.coprotec.net), après validation (environnement « prod »
#              avec Required reviewers sur GitHub)
# Relance manuelle : Actions → CI / déploiement → Run workflow, en choisissant la branche preprod ou prod.
# Secrets GitHub : REMOTE_HOST, REMOTE_PORT (2268), REMOTE_USER (coprotec), REMOTE_KNOWN_HOSTS, SSH_PRIVATE_KEY.
# Fournis par docker/vps/11-github-actions.sh (DEPLOIEMENT_VPS.md, étape 11).
name: CI / déploiement

on:
  push:
    branches: [main, preprod, prod]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, sodium
      - run: composer install --no-interaction --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - run: php bin/phpunit

  deploy:
    needs: tests
    if: github.event_name != 'pull_request' && (github.ref_name == 'preprod' || github.ref_name == 'prod')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    # Jamais deux déploiements simultanés du même environnement.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # La clé ne peut lancer qu'une commande (« deploy preprod » ou « deploy prod ») : commande forcée
      # ~coprotec/bin/deploy-gha.sh sur le serveur (docker/vps/deploy-gha.sh, installée par 11-github-actions.sh).
      - name: Déploiement ${{ github.ref_name }}
        env:
          ENV_NAME: ${{ github.ref_name }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_KNOWN_HOSTS: ${{ secrets.REMOTE_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$REMOTE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.REMOTE_PORT }}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" "deploy $ENV_NAME"
